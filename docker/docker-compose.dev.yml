# Base de donnees seule, pour developper avec `npm run dev` sur la machine hote.
services:
  db:
    image: postgres:16-alpine
    container_name: fa-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: francais_academy
    ports:
      - '5432:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data:
