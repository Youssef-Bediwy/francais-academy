services:
  db:
    image: postgres:16-alpine
    container_name: fa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: francais_academy
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d francais_academy']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fa-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/francais_academy?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-changez-ce-secret-de-developpement-32c}
      AUTH_COOKIE_NAME: fa_session
      AUTH_SESSION_TTL_DAYS: '30'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - '3000:3000'

  adminer:
    image: adminer:latest
    container_name: fa-adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - '8080:8080'
    profiles: ['tools']

volumes:
  postgres-data:
